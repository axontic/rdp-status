apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rdp-status.fullname" . }}
{{- $tlsProxy := .Values.tlsProxy | default dict }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "rdp-status.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "rdp-status.name" . }}
    spec:
      containers:
        - name: rdp-status
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.env.PORT }}
          env:
            - name: PORT
              value: "{{ .Values.env.PORT }}"
            - name: HEARTBEAT_MS
              value: "{{ .Values.env.HEARTBEAT_MS }}"
            - name: OFFLINE_MS
              value: "{{ .Values.env.OFFLINE_MS }}"
            - name: CONSOLE_BUSY
              value: "{{ .Values.env.CONSOLE_BUSY }}"
            - name: USE_CLIENT_OCCUPANCY
              value: "{{ .Values.env.USE_CLIENT_OCCUPANCY }}"
        {{- if ($tlsProxy.enabled | default false) }}
        - name: nginx-tls-proxy
          image: "{{ $tlsProxy.image.repository }}:{{ $tlsProxy.image.tag }}"
          imagePullPolicy: {{ $tlsProxy.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $tlsProxy.httpPort }}
            - name: https
              containerPort: {{ $tlsProxy.port }}
          volumeMounts:
            - name: tls-proxy-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: tls-proxy-cert
              mountPath: /etc/nginx/tls
              readOnly: true
        {{- end }}
      {{- if ($tlsProxy.enabled | default false) }}
      volumes:
        - name: tls-proxy-config
          configMap:
            name: {{ include "rdp-status.fullname" . }}-tls-proxy
        - name: tls-proxy-cert
          secret:
            secretName: {{ $tlsProxy.secretName }}
      {{- end }}


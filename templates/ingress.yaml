{{- $ingress := .Values.ingress | default dict }}
{{- if ($ingress.enabled | default false) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rdp-status.fullname" . }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if (($ingress.tls | default dict).enabled | default false) }}
  tls:
    - hosts:
        - {{ $ingress.host }}
      {{- with $ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rdp-status.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
